<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Double Dutch Motion Analytics</title>

  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />

  <!-- MediaPipe & Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --md-sys-color-background: #121318;
      --md-sys-color-surface: #1b1b21;
      --md-sys-color-surface-container: #26262e;
      --md-sys-color-surface-container-high: #313039;
      --md-sys-color-primary: #80d5ff;
      --md-sys-color-on-primary: #00344a;
      --md-sys-color-primary-container: #004c6a;
      --md-sys-color-on-primary-container: #c6e7ff;
      --md-sys-color-secondary-container: #42474e;
      --md-sys-color-on-secondary-container: #dce3e9;
      --md-sys-color-tertiary: #b1c5ff;
      --md-sys-color-error: #ffb4ab;
      --md-sys-color-error-container: #93000a;
      --md-sys-color-on-error: #690005;
      --md-sys-color-on-surface: #e2e2e9;
      --md-sys-color-on-surface-variant: #c2c7cf;
      --md-sys-color-outline: #8c9198;
      --md-shape-corner-medium: 12px;
      --md-shape-corner-large: 16px;
      --md-shape-corner-full: 9999px;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-surface);
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    header {
      width: 100%;
      max-width: 680px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 500;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-btns {
      display: flex;
      gap: 6px;
    }

    .icon {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-size: 20px;
      line-height: 1;
      display: inline-block;
      white-space: nowrap;
    }

    .card {
      width: 100%;
      max-width: 680px;
      background: var(--md-sys-color-surface);
      border-radius: var(--md-shape-corner-large);
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .source-tabs {
      display: flex;
      gap: 8px;
      width: 100%;
      margin-bottom: 8px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      background: var(--md-sys-color-surface-container);
      color: var(--md-sys-color-on-surface-variant);
      border: 1px solid var(--md-sys-color-outline);
      border-radius: var(--md-shape-corner-medium);
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      border-color: var(--md-sys-color-primary);
    }

    .toolbar-container {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .select-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--md-sys-color-surface-container);
      padding: 4px 10px;
      border-radius: var(--md-shape-corner-full);
      border: 1px solid var(--md-sys-color-outline);
    }

    select, input[type="file"], input[type="number"], input[type="text"], input[type="color"] {
      background: transparent;
      color: var(--md-sys-color-on-surface);
      border: none;
      font-size: 0.8rem;
      outline: none;
      cursor: pointer;
      font-family: inherit;
    }

    select option {
      background: var(--md-sys-color-surface-container);
      color: var(--md-sys-color-on-surface);
    }

    .file-input-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      color: var(--md-sys-color-primary);
    }

    .file-input-label input[type="file"] { display: none; }

    .video-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      background: var(--md-sys-color-surface-container);
      padding: 6px 10px;
      border-radius: var(--md-shape-corner-medium);
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--md-sys-color-primary);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .icon-btn:hover { background: rgba(255, 255, 255, 0.1); }

    .seek-slider {
      flex-grow: 1;
      accent-color: var(--md-sys-color-primary);
      cursor: pointer;
    }

    .btn-icon-only {
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
      border: 1px solid var(--md-sys-color-outline);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .btn-icon-only.error {
      background: var(--md-sys-color-error-container);
      color: var(--md-sys-color-error);
      border: none;
    }

    .btn-secondary {
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
      border: 1px solid var(--md-sys-color-outline);
      padding: 6px 12px;
      font-size: 0.8rem;
      border-radius: var(--md-shape-corner-full);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-secondary:disabled, .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border: none;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: var(--md-shape-corner-full);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--md-sys-color-surface);
      width: 90%;
      max-width: 500px;
      max-height: 85vh;
      border-radius: var(--md-shape-corner-large);
      border: 1px solid var(--md-sys-color-surface-container-high);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--md-sys-color-surface-container-high);
    }

    .modal-title {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--md-sys-color-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-body {
      padding: 12px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-footer {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      border-top: 1px solid var(--md-sys-color-surface-container-high);
      background: var(--md-sys-color-surface-container);
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--md-sys-color-tertiary);
      letter-spacing: 0.5px;
    }

    .config-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--md-sys-color-surface-container);
      padding: 10px;
      border-radius: var(--md-shape-corner-medium);
    }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
    }

    .slider-group label {
      color: var(--md-sys-color-on-surface-variant);
      width: 130px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .slider-group input[type="range"] {
      flex-grow: 1;
      height: 4px;
      accent-color: var(--md-sys-color-primary);
      cursor: pointer;
    }

    .slider-value {
      width: 45px;
      text-align: right;
      color: var(--md-sys-color-primary);
      font-family: 'Roboto Mono', monospace;
      font-weight: 700;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.8rem;
      color: var(--md-sys-color-on-surface-variant);
      flex-wrap: wrap;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .checkbox-label.disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .history-item {
      background: var(--md-sys-color-surface-container);
      padding: 8px 12px;
      border-radius: var(--md-shape-corner-medium);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .history-date {
      font-size: 0.75rem;
      color: var(--md-sys-color-on-surface-variant);
    }

    .history-count {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--md-sys-color-primary);
      font-family: 'Roboto Mono', monospace;
    }

    #media-container {
      position: relative;
      width: 100%;
      max-width: 680px;
      background: #000;
      border-radius: var(--md-shape-corner-large);
      overflow: hidden;
      border: 1px solid var(--md-sys-color-surface-container-high);
    }

    #input_video { display: none; }

    #output_canvas {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .preview-overlay-controls {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 20;
    }

    .preview-overlay-controls * { pointer-events: auto; }

    .top-overlay-bar {
      position: absolute;
      top: 10px; left: 10px;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .camera-switch-btn, .timer-toggle-btn, .fullscreen-btn {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      border-radius: var(--md-shape-corner-full);
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    .camera-switch-btn, .fullscreen-btn { width: 32px; }

    .timer-toggle-btn {
      padding: 0 10px;
      font-size: 0.75rem;
      font-weight: 700;
      gap: 4px;
    }

    .fullscreen-btn {
      position: absolute;
      top: 10px; right: 10px;
    }

    .shutter-bar {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
    }

    #media-container.landscape .shutter-bar {
      top: 50%; right: 16px;
      flex-direction: column;
      transform: translateY(-50%);
    }

    #media-container.portrait .shutter-bar {
      bottom: 16px; left: 50%;
      flex-direction: row;
      transform: translateX(-50%);
    }

    .shutter-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(6px);
      border: 3px solid rgba(255, 255, 255, 0.9);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      outline: none;
    }

    .shutter-btn.video-rec .shutter-inner {
      width: 20px; height: 20px;
      border-radius: 50%;
      background-color: #ff3b30;
    }

    .shutter-btn.video-rec.recording .shutter-inner {
      border-radius: 3px;
      width: 16px; height: 16px;
    }

    .shutter-btn.analytics-start .shutter-inner {
      width: 20px; height: 20px;
      border-radius: 50%;
      background-color: #80d5ff;
    }

    .shutter-btn.analytics-start.recording .shutter-inner {
      border-radius: 3px;
      width: 16px; height: 16px;
      background-color: #ff9500;
    }

    .countdown-overlay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 30;
      font-size: 5rem;
      font-weight: 700;
      color: #ffffff;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .countdown-overlay.visible { opacity: 1; }

    /* 進捗表示オーバーレイ */
    .processing-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(18, 19, 24, 0.85);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .processing-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .progress-bar-box {
      width: 70%;
      height: 8px;
      background: var(--md-sys-color-surface-container-high);
      border-radius: var(--md-shape-corner-full);
      overflow: hidden;
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: var(--md-sys-color-primary);
      transition: width 0.1s linear;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .metric-card {
      background: var(--md-sys-color-surface-container);
      border-radius: var(--md-shape-corner-medium);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
    }

    .metric-label {
      font-size: 0.7rem;
      color: var(--md-sys-color-on-surface-variant);
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .metric-value {
      font-family: 'Roboto Mono', monospace;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--md-sys-color-primary);
    }

    .metric-value.count { color: #81c784; }
    .metric-value.time { color: #ba68c8; font-size: 1.1rem; }

    .mode-section-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mode-group-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .segmented-button-group {
      display: inline-flex;
      background: var(--md-sys-color-surface-container);
      border: 1px solid var(--md-sys-color-outline);
      border-radius: var(--md-shape-corner-full);
      padding: 2px;
      gap: 2px;
    }

    .segmented-btn {
      background: transparent;
      border: none;
      color: var(--md-sys-color-on-surface-variant);
      padding: 4px 10px;
      border-radius: var(--md-shape-corner-full);
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .segmented-btn.active {
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      font-weight: 700;
    }

    .segmented-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    #chart-container {
      width: 100%;
      max-width: 680px;
      background: var(--md-sys-color-surface);
      border-radius: var(--md-shape-corner-large);
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    #chart-container canvas {
      width: 100% !important;
      height: auto !important;
    }
  </style>
</head>
<body>

  <!-- App Header -->
  <header>
    <h1><span class="icon">analytics</span> Analytics</h1>
    <div class="header-btns">
      <button class="btn-icon-only" onclick="openHistoryModal()" title="履歴">
        <span class="icon">history</span>
      </button>
      <button class="btn-icon-only" onclick="openSettingsModal()" title="設定">
        <span class="icon">settings</span>
      </button>
      <button class="btn-icon-only error" onclick="resetCounter()" title="リセット">
        <span class="icon">restart_alt</span>
      </button>
    </div>
  </header>

  <!-- Video Player Controls (File Mode Only) -->
  <div id="file-controls-bar" class="card" style="display: none;">
    <div class="video-controls" style="flex-wrap: wrap;">
      <button id="play-pause-btn" class="icon-btn" onclick="toggleVideoPlay()">
        <span class="icon" id="play-icon">play_arrow</span>
      </button>
      <input type="range" id="seek-slider" class="seek-slider" min="0" max="100" value="0" step="0.01">
      <span id="video-time-display" style="font-family: 'Roboto Mono', monospace; font-size: 0.7rem; color: var(--md-sys-color-on-surface-variant);">00:00 / 00:00</span>
      <div class="select-wrapper" style="padding: 2px 6px;">
        <select id="playback-rate-select">
          <option value="0.25">0.25x</option>
          <option value="0.5">0.5x</option>
          <option value="1.0" selected>1.0x</option>
          <option value="1.5">1.5x</option>
          <option value="2.0">2.0x</option>
        </select>
      </div>
      <!-- 動画解析用トリガーボタンと時間設定 -->
      <div style="display: flex; gap: 6px; align-items: center; width: 100%; margin-top: 4px; font-size: 0.75rem; flex-wrap: wrap;">
        <button class="btn-secondary" onclick="setCurrentTimeAsStart()" style="padding: 2px 8px;">
          <span class="icon" style="font-size:14px;">place</span> 現位置を開始に指定
        </button>
        <span>開始:</span>
        <input type="number" id="file-start-sec" value="0" min="0" step="0.1" style="width: 50px; background: var(--md-sys-color-surface-container); color:#fff; border-radius:4px; padding:2px 4px;">
        <span>s</span>
        
        <span>期間:</span>
        <div class="select-wrapper" style="padding: 2px 6px;">
          <select id="file-duration-select">
            <option value="10">10s</option>
            <option value="30" selected>30s</option>
            <option value="60">60s</option>
            <option value="0">エンドレス</option>
          </select>
        </div>

        <button class="btn-primary" onclick="startFileAnalysis()" style="margin-left: auto;">
          <span class="icon">analytics</span> 解析開始
        </button>
      </div>
    </div>
  </div>

  <!-- Media Viewport -->
  <div id="media-container" class="landscape">
    <video id="input_video" playsinline crossorigin="anonymous"></video>
    <canvas id="output_canvas"></canvas>

    <div class="preview-overlay-controls">
      <div class="top-overlay-bar">
        <button id="camera-switch-btn" class="camera-switch-btn" onclick="switchNextCamera()">
          <span class="icon">flip_camera_android</span>
        </button>
        <button id="timer-toggle-btn" class="timer-toggle-btn" onclick="cycleMeasurementTimer()">
          <span class="icon" style="font-size: 16px;">timer</span>
          <span id="timer-toggle-label">10s</span>
        </button>
      </div>

      <button class="fullscreen-btn" onclick="toggleFullScreen()">
        <span class="icon" id="fullscreen-icon">fullscreen</span>
      </button>

      <div class="shutter-bar">
        <button id="shutter-video-btn" class="shutter-btn video-rec" onclick="toggleVideoRecording()">
          <div class="shutter-inner"></div>
        </button>
        <button id="shutter-analytics-btn" class="shutter-btn analytics-start" onclick="startTimerRecording()">
          <div class="shutter-inner"></div>
        </button>
      </div>
    </div>

    <div id="countdown-overlay-text" class="countdown-overlay">3</div>

    <!-- バックグラウンド解析処理プログレスUI -->
    <div id="processing-overlay" class="processing-overlay">
      <span class="icon" style="font-size: 40px; color: var(--md-sys-color-primary);">analytics</span>
      <div style="font-size: 0.9rem; font-weight: 500;">動画バックグラウンド解析中...</div>
      <div class="progress-bar-box">
        <div id="progress-bar-fill" class="progress-bar-fill"></div>
      </div>
      <div style="display: flex; gap: 16px; font-size: 0.8rem; font-family: 'Roboto Mono', monospace;">
        <span id="progress-percent">0%</span>
        <span id="progress-eta">ETA: --s</span>
      </div>
    </div>
  </div>

  <!-- Metrics -->
  <div class="card metrics-grid">
    <div class="metric-card">
      <span class="metric-label" id="track-target-label"><span class="icon">my_location</span> Speed</span>
      <span id="speed-val" class="metric-value">0.0</span>
    </div>
    <div class="metric-card">
      <span class="metric-label"><span class="icon">numbers</span> Count</span>
      <span id="count-val" class="metric-value count">0</span>
    </div>
    <div class="metric-card">
      <span class="metric-label"><span class="icon">schedule</span> Turn</span>
      <span id="time-val" class="metric-value time">0.00s</span>
    </div>

  <script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const cameraSelect = document.getElementById('camera-select');
    const fpsSelect = document.getElementById('fps-select');
    const mediaContainer = document.getElementById('media-container');

    const videoFileInput = document.getElementById('video-file-input');
    const fileNameDisplay = document.getElementById('file-name-display');
    const fileControlsBar = document.getElementById('file-controls-bar');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const playIcon = document.getElementById('play-icon');
    const seekSlider = document.getElementById('seek-slider');
    const videoTimeDisplay = document.getElementById('video-time-display');
    const playbackRateSelect = document.getElementById('playback-rate-select');

    const countdownSecInput = document.getElementById('countdown-sec-input');
    const customTimerSecInput = document.getElementById('custom-timer-sec-input');
    const countdownOverlayText = document.getElementById('countdown-overlay-text');

    const shutterVideoBtn = document.getElementById('shutter-video-btn');
    const shutterAnalyticsBtn = document.getElementById('shutter-analytics-btn');
    const cameraSwitchBtn = document.getElementById('camera-switch-btn');
    const timerToggleBtn = document.getElementById('timer-toggle-btn');
    const timerToggleLabel = document.getElementById('timer-toggle-label');

    const detectLmSelect = document.getElementById('detect-lm-select');
    const detectMethodSelect = document.getElementById('detect-method-select');

    const zoomSlider = document.getElementById('zoom-slider');
    const zoomDisplay = document.getElementById('zoom-val-display');
    const thresholdSlider = document.getElementById('threshold-slider');
    const thresholdDisplay = document.getElementById('threshold-val-display');
    const cooldownSlider = document.getElementById('cooldown-slider');
    const cooldownDisplay = document.getElementById('cooldown-val-display');

    const flipHCheck = document.getElementById('flip-h-check');
    const flipVCheck = document.getElementById('flip-v-check');
    const rotationSelect = document.getElementById('rotation-select');

    const overlayShowTextCheck = document.getElementById('overlay-show-text-check');
    const overlayShowSkelCheck = document.getElementById('overlay-show-skel-check');
    const overlayShowGraphCheck = document.getElementById('overlay-show-graph-check');
    const overlayShowPaceCheck = document.getElementById('overlay-show-pace-check');
    const overlayShowDropCheck = document.getElementById('overlay-show-drop-check');
    const overlayTextColorInput = document.getElementById('overlay-text-color-input');
    const overlayPositionSelect = document.getElementById('overlay-position-select');
    const overlayScaleSlider = document.getElementById('overlay-scale-slider');
    const overlayScaleDisplay = document.getElementById('overlay-scale-display');

    const processingOverlay = document.getElementById('processing-overlay');
    const progressBarFill = document.getElementById('progress-bar-fill');
    const progressPercent = document.getElementById('progress-percent');
    const progressEta = document.getElementById('progress-eta');

    let zoomFactor = parseFloat(zoomSlider.value);
    let threshold = parseFloat(thresholdSlider.value);
    let cooldownSec = parseFloat(cooldownSlider.value);

    let flipH = flipHCheck.checked;
    let flipV = flipVCheck.checked;
    let rotationAngle = parseInt(rotationSelect.value, 10);
    let currentFps = 30;

    let sourceMode = 'camera';

    let currentRole = 'jumper';
    let currentGraph = 'speed';

    const timerPresets = [10, 30, 60, 0];
    let selectedTimerSec = 30;

    let isRecording = false;
    let recordedData = [];
    let countTimestamps = [];
    let recordStartTime = 0;
    let countdownInterval = null;
    let timerCheckInterval = null;

    let mediaRecorder = null;
    let recordedChunks = [];
    let isVideoRecording = false;

    let measurementHistory = [];
    let currentActiveRecordData = null;

    // 動画バックグラウンド解析用変数
    let fileAnalysisResult = null; 
    let audioCtx = null;
    let audioSourceNode = null;
    let audioDestinationNode = null;

    zoomSlider.addEventListener('input', (e) => {
      zoomFactor = parseFloat(e.target.value);
      zoomDisplay.innerText = zoomFactor.toFixed(1) + 'x';
    });

    thresholdSlider.addEventListener('input', (e) => {
      threshold = parseFloat(e.target.value);
      thresholdDisplay.innerText = threshold.toFixed(3);
    });

    cooldownSlider.addEventListener('input', (e) => {
      cooldownSec = parseFloat(e.target.value);
      cooldownDisplay.innerText = cooldownSec.toFixed(2) + 's';
    });

    overlayScaleSlider.addEventListener('input', (e) => {
      overlayScaleDisplay.innerText = parseFloat(e.target.value).toFixed(1) + 'x';
    });

    flipHCheck.addEventListener('change', (e) => { flipH = e.target.checked; });
    flipVCheck.addEventListener('change', (e) => { flipV = e.target.checked; });
    rotationSelect.addEventListener('change', (e) => { rotationAngle = parseInt(e.target.value, 10); });

    customTimerSecInput.addEventListener('change', (e) => {
      let val = parseInt(e.target.value, 10);
      if (isNaN(val) || val < 0) val = 0;
      selectedTimerSec = val;
      updateTimerLabel();
    });

    function openSettingsModal() {
      document.getElementById('settings-modal').classList.add('open');
    }

    function closeSettingsModal() {
      document.getElementById('settings-modal').classList.remove('open');
    }

    function openHistoryModal() {
      renderHistoryList();
      document.getElementById('history-modal').classList.add('open');
    }

    function closeHistoryModal() {
      document.getElementById('history-modal').classList.remove('open');
    }

    function renderHistoryList() {
      const container = document.getElementById('history-list-container');
      container.innerHTML = '';

      if (measurementHistory.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: var(--md-sys-color-on-surface-variant); padding: 16px 0; font-size: 0.8rem;">履歴なし</div>';
        return;
      }

      measurementHistory.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'history-item';
        const durLabel = item.duration > 0 ? `${item.duration}s` : 'Endless';
        div.innerHTML = `
          <div style="display:flex; flex-direction:column;">
            <span class="history-date">${item.timestampStr}</span>
            <span class="history-count">${item.count} cnt (${durLabel})</span>
          </div>
          <div style="display:flex; gap: 4px;">
            <button class="btn-secondary" style="padding: 4px 8px; font-size: 0.75rem;" onclick="exportHistoryCsv(${index})">CSV</button>
            <button class="btn-primary" style="padding: 4px 8px; font-size: 0.75rem;" onclick="openPaceModalFromHistory(${index})">Graph</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function exportHistoryCsv(index) {
      const item = measurementHistory[index];
      if (!item || !item.countTimestamps || item.countTimestamps.length === 0) return;

      let csvContent = "data:text/csv;charset=utf-8,Count,Elapsed_Time_Sec,Speed_RPM,Turn_Time_Sec\n";
      item.countTimestamps.forEach(row => {
        csvContent += `${row.count},${row.elapsedSec.toFixed(3)},${row.speed ? row.speed.toFixed(2) : ''},${row.turnTime ? row.turnTime.toFixed(3) : ''}\n`;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `count_${item.timestampStr.replace(/[: /]/g, '_')}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function openPaceModalFromHistory(index) {
      const item = measurementHistory[index];
      if (!item || !item.recordedData) return;
      
      currentActiveRecordData = item.recordedData;
      closeHistoryModal();
      openPaceModal(currentActiveRecordData);
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        mediaContainer.requestFullscreen().catch(err => console.error(err));
      } else {
        document.exitFullscreen();
      }
    }

    document.addEventListener('fullscreenchange', () => {
      const fsIcon = document.getElementById('fullscreen-icon');
      fsIcon.innerText = document.fullscreenElement ? 'fullscreen_exit' : 'fullscreen';
    });

    function cycleMeasurementTimer() {
      const idx = timerPresets.indexOf(selectedTimerSec);
      selectedTimerSec = idx !== -1 ? timerPresets[(idx + 1) % timerPresets.length] : timerPresets[0];
      customTimerSecInput.value = selectedTimerSec;
      updateTimerLabel();
    }

    function updateTimerLabel() {
      timerToggleLabel.innerText = selectedTimerSec === 0 ? "Endless" : `${selectedTimerSec}s`;
    }

    async function switchNextCamera() {
      const options = Array.from(cameraSelect.options);
      if (options.length <= 1) return;

      const currentIdx = cameraSelect.selectedIndex;
      const nextIdx = (currentIdx + 1) % options.length;
      cameraSelect.selectedIndex = nextIdx;

      const targetDeviceId = options[nextIdx].value;
      await updateSupportedFpsOptions(targetDeviceId);
      startCamera(targetDeviceId, parseInt(fpsSelect.value, 10));
    }

    function toggleVideoRecording() {
      if (isVideoRecording) stopVideoRecording();
      else startVideoRecording();
    }

    function setupAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        audioDestinationNode = audioCtx.createMediaStreamDestination();
        audioSourceNode = audioCtx.createMediaElementSource(videoElement);
        audioSourceNode.connect(audioCtx.destination);
        audioSourceNode.connect(audioDestinationNode);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function startVideoRecording() {
      recordedChunks = [];
      const canvasStream = canvasElement.captureStream(currentFps || 30);
      let combinedStream = new MediaStream();

      canvasStream.getVideoTracks().forEach(track => combinedStream.addTrack(track));

      if (sourceMode === 'file') {
        setupAudioContext();
        audioDestinationNode.stream.getAudioTracks().forEach(track => combinedStream.addTrack(track));
      }

      let options = { mimeType: 'video/webm;codecs=vp9,opus' };
      if (!MediaRecorder.isTypeSupported(options.mimeType)) options = { mimeType: 'video/webm' };

      try { mediaRecorder = new MediaRecorder(combinedStream, options); }
      catch (e) { return; }

      mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = saveRecordedVideo;
      mediaRecorder.start();
      isVideoRecording = true;
      shutterVideoBtn.classList.add('recording');
    }

    function stopVideoRecording() {
      if (!isVideoRecording || !mediaRecorder) return;
      mediaRecorder.stop();
      isVideoRecording = false;
      shutterVideoBtn.classList.remove('recording');
    }

    function saveRecordedVideo() {
      const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `video_${Date.now()}.webm`;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
      }, 100);
    }

    let currentStream = null;
    let animFrameId = null;
    let isProcessing = false;
    const BUFFER_SIZE = 60;

    function resetBuffer() {
      return {
        rw_x: Array(BUFFER_SIZE).fill(0.5),
        rw_y: Array(BUFFER_SIZE).fill(0.5),
        lw_x: Array(BUFFER_SIZE).fill(0.5),
        lw_y: Array(BUFFER_SIZE).fill(0.5),
        target_val: Array(BUFFER_SIZE).fill(0),
        raw_speed: Array(BUFFER_SIZE).fill(0),
        smoothed_speed: Array(BUFFER_SIZE).fill(0)
      };
    }

    let buffer = resetBuffer();
    let lastTurnTime = 0;
    let lastStateTime = 0;
    let state = 'DOWN';
    let valleyY = 0.5;
    let peakY = 0.5;
    let totalCount = 0;
    let flashFrames = 0;
    let currentS = 0;
    let smoothedS = 0;
    const speedHistory = [];

    function resetCounter() {
      if (isRecording || countdownInterval) stopRecordingData(false);
      totalCount = 0;
      lastTurnTime = 0;
      state = 'DOWN';
      buffer = resetBuffer();
      speedHistory.length = 0;
      countTimestamps = [];
      fileAnalysisResult = null;
      document.getElementById('count-val').innerText = '0';
      document.getElementById('speed-val').innerText = '0.0';
      document.getElementById('time-val').innerText = '0.00s';
    }

    function startTimerRecording() {
      if (sourceMode === 'file') return;

      if (isRecording) {
        stopRecordingData(true);
        return;
      }

      resetCounter();
      recordedData = [];
      countTimestamps = [];
      shutterAnalyticsBtn.disabled = true;

      let countdown = parseInt(countdownSecInput.value, 10) || 0;

      if (countdown <= 0) {
        startRecordingData();
        return;
      }

      countdownOverlayText.innerText = countdown;
      countdownOverlayText.classList.add('visible');

      if (countdownInterval) clearInterval(countdownInterval);
      countdownInterval = setInterval(() => {
        countdown--;
        if (countdown > 0) {
          countdownOverlayText.innerText = countdown;
        } else {
          clearInterval(countdownInterval);
          countdownInterval = null;
          countdownOverlayText.classList.remove('visible');
          startRecordingData();
        }
      }, 1000);
    }

    function startRecordingData() {
      isRecording = true;
      recordStartTime = performance.now();
      shutterAnalyticsBtn.disabled = false;
      shutterAnalyticsBtn.classList.add('recording');

      if (timerCheckInterval) clearInterval(timerCheckInterval);

      if (selectedTimerSec > 0) {
        timerCheckInterval = setInterval(() => {
          if (!isRecording) {
            clearInterval(timerCheckInterval);
            return;
          }
          const elapsed = (performance.now() - recordStartTime) / 1000.0;
          if (elapsed >= selectedTimerSec) {
            clearInterval(timerCheckInterval);
            stopRecordingData(true);
          }
        }, 100);
      }
    }

    function stopRecordingData(exportData = true) {
      if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
      if (timerCheckInterval) { clearInterval(timerCheckInterval); timerCheckInterval = null; }
      countdownOverlayText.classList.remove('visible');

      const wereRecording = isRecording;
      isRecording = false;
      shutterAnalyticsBtn.disabled = false;
      shutterAnalyticsBtn.classList.remove('recording');

      if (wereRecording && exportData) {
        const now = new Date();
        const timestampStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
        
        measurementHistory.unshift({
          timestampStr: timestampStr,
          count: totalCount,
          duration: selectedTimerSec,
          recordedData: [...recordedData],
          countTimestamps: [...countTimestamps]
        });
        currentActiveRecordData = recordedData;
        openPaceModal(recordedData);
      }
    }

    function openPaceModal(dataToUse) {
      const targetData = dataToUse || recordedData;
      const validLogs = targetData.filter(d => d.id >= 3 && d.calculatedValue !== null);
      if (validLogs.length < 3) return;

      const latestId = targetData[targetData.length - 1].id;
      document.getElementById('analysis-start-tag').value = 3;
      document.getElementById('analysis-end-tag').value = latestId;
      document.getElementById('pace-analysis-modal').classList.add('open');
    }

    function closePaceModal() {
      document.getElementById('pace-analysis-modal').classList.remove('open');
    }

    function calculatePercentile(sortedArr, p) {
      if (sortedArr.length === 0) return 0;
      if (sortedArr.length === 1) return sortedArr[0];
      const index = (sortedArr.length - 1) * p;
      const lower = Math.floor(index);
      const upper = Math.ceil(index);
      return sortedArr[lower] * (1 - (index - lower)) + sortedArr[upper] * (index - lower);
    }

    function executePaceAnalysisExport() {
      const dataToUse = currentActiveRecordData || recordedData;
      const title = document.getElementById('analysis-title-input').value.trim() || "Pace Analysis";
      const startTagId = parseInt(document.getElementById('analysis-start-tag').value, 10);
      const endTagId = parseInt(document.getElementById('analysis-end-tag').value, 10);
      const removeOutliers = document.getElementById('analysis-iqr-toggle').checked;

      const extracted = dataToUse.filter(d => d.id >= startTagId && d.id <= endTagId && d.calculatedValue !== null);
      if (extracted.length < 2) return;

      const unixMs0 = dataToUse[0].unixMs;
      const P = extracted.map(d => ({ x: (d.unixMs - unixMs0) / 1000.0, y: d.calculatedValue, id: d.id }));

      let P_valid = [];
      if (removeOutliers) {
        const yVals = P.map(p => p.y).sort((a, b) => a - b);
        const q1 = calculatePercentile(yVals, 0.25);
        const q3 = calculatePercentile(yVals, 0.75);
        const iqr = q3 - q1;
        P_valid = P.filter(p => p.y >= q1 - 1.5 * iqr && p.y <= q3 + 1.5 * iqr);
        if (P_valid.length < 2) P_valid = [...P];
      } else {
        P_valid = [...P];
      }

      const n = P_valid.length;
      let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0;
      P_valid.forEach(p => { sumX += p.x; sumY += p.y; sumXY += p.x * p.y; sumX2 += p.x * p.x; });

      const denom = n * sumX2 - sumX * sumX;
      let a = Math.abs(denom) > 1e-9 ? (n * sumXY - sumX * sumY) / denom : 0;
      let b = Math.abs(denom) > 1e-9 ? (sumY - a * sumX) / n : sumY / n;

      const xValid0 = P_valid[0].x;
      const xValidN1 = P_valid[P_valid.length - 1].x;
      const yStart = a * xValid0 + b;
      const yEnd = a * xValidN1 + b;
      const ratio = yStart !== 0 ? (yEnd / yStart) * 100 : 0;

      const formulaStr = `y = ${a.toFixed(4)}x ${b >= 0 ? '+' : '-'} ${Math.abs(b).toFixed(2)} (${yStart.toFixed(2)} -> ${yEnd.toFixed(2)}) ${ratio.toFixed(1)}%`;

      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = 1000;
      exportCanvas.height = 500;
      const ctx = exportCanvas.getContext('2d');

      ctx.fillStyle = '#121318';
      ctx.fillRect(0, 0, 1000, 500);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 20px Roboto, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(title, 500, 36);

      ctx.fillStyle = '#80d5ff';
      ctx.font = '14px "Roboto Mono", monospace';
      ctx.fillText(formulaStr, 500, 64);

      const dataURL = exportCanvas.toDataURL('image/png');
      const downloadLink = document.createElement('a');
      downloadLink.download = `${title}.png`;
      downloadLink.href = dataURL;
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);

      closePaceModal();
    }

    const CONNECTIONS = [
      [11, 13], [13, 15], [12, 14], [14, 16],
      [11, 12], [11, 23], [12, 24], [23, 24],
      [23, 25], [25, 27], [24, 26], [26, 28]

    function setRoleMode(role) {

    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });
    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    function getEffectivePoint(p, isFlipH, isFlipV, rot) {
      let x = isFlipH ? 1.0 - p.x : p.x;
      let y = isFlipV ? 1.0 - p.y : p.y;
      let rx = x, ry = y;
      if (rot === 90) { rx = 1.0 - y; ry = x; }
      else if (rot === 180) { rx = 1.0 - x; ry = 1.0 - y; }
      else if (rot === 270) { rx = y; ry = 1.0 - x; }
      return { x: rx, y: ry, z: p.z || 0 };
    }

    // カメラリアルタイム時のMediapipe結果処理
    pose.onResults((results) => {
      if (sourceMode === 'file') return; // 動画モード時は専用ループで描画

      const vWidth = videoElement.videoWidth || 640;
      const vHeight = videoElement.videoHeight || 480;

      let nativeW = (rotationAngle === 90 || rotationAngle === 270) ? vHeight : vWidth;
      let nativeH = (rotationAngle === 90 || rotationAngle === 270) ? vWidth : vHeight;

      mediaContainer.classList.toggle('portrait', nativeH > nativeW);
      mediaContainer.classList.toggle('landscape', nativeH <= nativeW);

      canvasElement.width = nativeW;
      canvasElement.height = nativeH;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, nativeW, nativeH);

      canvasCtx.translate(nativeW / 2, nativeH / 2);
      if (flipH || flipV) canvasCtx.scale(flipH ? -1 : 1, flipV ? -1 : 1);
      canvasCtx.rotate((rotationAngle * Math.PI) / 180);
      canvasCtx.scale(zoomFactor, zoomFactor);

      canvasCtx.drawImage(results.image, -vWidth / 2, -vHeight / 2, vWidth, vHeight);

      const lmToCanvasPx = (p) => ({ x: (p.x - 0.5) * vWidth, y: (p.y - 0.5) * vHeight });

      let elapsedTimeSec = 0;
      const now = performance.now();

      if (results.poseLandmarks) {
        const lm = results.poseLandmarks;
        const targetLm = lm[parseInt(detectLmSelect.value, 10)];
        const lwEff = getEffectivePoint(lm[15], flipH, flipV, rotationAngle);
        const rwEff = getEffectivePoint(lm[16], flipH, flipV, rotationAngle);

        buffer.lw_x.shift(); buffer.lw_x.push(lwEff.x);
        buffer.lw_y.shift(); buffer.lw_y.push(lwEff.y);
        buffer.rw_x.shift(); buffer.rw_x.push(rwEff.x);
        buffer.rw_y.shift(); buffer.rw_y.push(rwEff.y);

        let targetAxisVal = 0;
        if (targetLm) {
          const effPt = getEffectivePoint(targetLm, flipH, flipV, rotationAngle);
          const method = detectMethodSelect.value;
          if (method === 'y_pos') targetAxisVal = 1.0 - effPt.y;
          else if (method === 'x_pos') targetAxisVal = effPt.x;
          else if (method === 'z_pos') targetAxisVal = effPt.z;
        }
        buffer.target_val.shift(); buffer.target_val.push(targetAxisVal);

        let currentY = targetLm ? getEffectivePoint(targetLm, flipH, flipV, rotationAngle).y : 0;
        const timeSinceLastState = (now - lastStateTime) / 1000.0;
        let turnTime = 0;

        if (state === 'DOWN') {
          if (currentY > valleyY) valleyY = currentY;
          if (currentY < valleyY - threshold && timeSinceLastState > cooldownSec) {
            state = 'UP';
            peakY = currentY;
            lastStateTime = now;
          }
        } else if (state === 'UP') {
          if (currentY < peakY) peakY = currentY;
          if (currentY > peakY + threshold && timeSinceLastState > cooldownSec) {
            state = 'DOWN';
            valleyY = currentY;
            lastStateTime = now;
            totalCount++;
            flashFrames = 5;

            if (lastTurnTime > 0) {
              turnTime = (now - lastTurnTime) / 1000.0;
              if (turnTime >= 0.12 && turnTime <= 4.0) {
                // 【変更】 Speedの計算結果を2で割る
                currentS = (60.0 / turnTime) / 2.0;
                speedHistory.push(currentS);
                if (speedHistory.length > 3) speedHistory.shift();
                smoothedS = speedHistory.reduce((a, b) => a + b, 0) / speedHistory.length;

                document.getElementById('speed-val').innerText = smoothedS.toFixed(1);
                document.getElementById('time-val').innerText = turnTime.toFixed(2) + 's';
              }
            }
            document.getElementById('count-val').innerText = totalCount;
            lastTurnTime = now;

            if (isRecording) {
              countTimestamps.push({
                count: totalCount,
                elapsedSec: (now - recordStartTime) / 1000.0,
                speed: smoothedS,
                turnTime: turnTime
              });
            }
          }
        }

        buffer.raw_speed.shift(); buffer.raw_speed.push(currentS);
        buffer.smoothed_speed.shift(); buffer.smoothed_speed.push(smoothedS);

        if (isRecording) {
          recordedData.push({ unixMs: Date.now(), id: totalCount, calculatedValue: smoothedS > 0 ? smoothedS : null });
        }

        updateChart();

        if (overlayShowSkelCheck.checked) {
          canvasCtx.save();
          canvasCtx.globalAlpha = 0.08;
          canvasCtx.strokeStyle = '#80d5ff';
          canvasCtx.lineWidth = 1 / zoomFactor;
          CONNECTIONS.forEach(([s, e]) => {
            if (lm[s] && lm[e]) {
              const p1 = lmToCanvasPx(lm[s]);
              const p2 = lmToCanvasPx(lm[e]);
              canvasCtx.beginPath();
              canvasCtx.moveTo(p1.x, p1.y);
              canvasCtx.lineTo(p2.x, p2.y);
              canvasCtx.stroke();
            }
          });
          canvasCtx.restore();
        }

        if (flashFrames > 0) {
          canvasCtx.strokeStyle = '#81c784';
          canvasCtx.lineWidth = 8 / zoomFactor;
          canvasCtx.strokeRect(-vWidth / 2, -vHeight / 2, vWidth, vHeight);
          flashFrames--;
        }

        canvasCtx.restore();
      } else {
        canvasCtx.restore();
      }

      if (isRecording) elapsedTimeSec = (now - recordStartTime) / 1000.0;

      const showText = overlayShowTextCheck.checked;
      const scale = parseFloat(overlayScaleSlider.value);
      const textColor = overlayTextColorInput.value || '#ffffff';

      canvasCtx.save();
      if (showText) {
        canvasCtx.fillStyle = textColor;
        canvasCtx.font = `700 ${Math.round(16 * scale)}px "Roboto Mono", monospace`;
        canvasCtx.fillText(`C: ${totalCount} | T: ${elapsedTimeSec.toFixed(1)}s`, 12, 24 * scale);
      }
      canvasCtx.restore();
    });

    // ==========================================
    // 動画ファイル：シーク位置設定＆一括解析
    // ==========================================
    function setCurrentTimeAsStart() {
      if (!videoElement.src || sourceMode !== 'file') return;
      document.getElementById('file-start-sec').value = videoElement.currentTime.toFixed(1);
    }

    async function startFileAnalysis() {
      if (!videoElement.src || sourceMode !== 'file') return;

      const startTime = parseFloat(document.getElementById('file-start-sec').value) || 0;
      const selectedDur = parseFloat(document.getElementById('file-duration-select').value);
      
      // 0（エンドレス）の場合は動画の末尾まで
      const duration = (selectedDur === 0) ? (videoElement.duration - startTime) : selectedDur;
      const endTime = Math.min(startTime + duration, videoElement.duration);

      if (startTime >= videoElement.duration) return;

      videoElement.pause();
      processingOverlay.classList.add('open');
      progressBarFill.style.width = '0%';
      progressPercent.innerText = '0%';
      progressEta.innerText = 'ETA: --s';

      let localState = 'DOWN';
      let localValleyY = 0.5;
      let localPeakY = 0.5;
      let localLastStateTime = -999;
      let localLastTurnTime = 0;
      let localCount = 0;
      const localSpeedHist = [];

      const analysisTimestamps = [];
      const analysisRecData = [];

      const step = 1 / 30; // 30fpsコマ送り
      let currentSeek = startTime;

      const processStartTime = performance.now();
      const totalSteps = Math.ceil((endTime - startTime) / step);
      let stepCount = 0;

      while (currentSeek <= endTime) {
        videoElement.currentTime = currentSeek;
        await new Promise(r => {
          const onSeeked = () => {
            videoElement.removeEventListener('seeked', onSeeked);
            r();
          };
          videoElement.addEventListener('seeked', onSeeked);
        });

        const poseResults = await new Promise(resolve => {
          pose.onResults(resolve);
          pose.send({ image: videoElement });
        });

        if (poseResults && poseResults.poseLandmarks) {
          const lm = poseResults.poseLandmarks;
          const targetLm = lm[parseInt(detectLmSelect.value, 10)];

          if (targetLm) {
            let currentY = getEffectivePoint(targetLm, flipH, flipV, rotationAngle).y;
            let timeSinceState = currentSeek - localLastStateTime;
            let turnTime = 0;
            let currentS = 0;
            let smoothedS = 0;

            if (localState === 'DOWN') {
              if (currentY > localValleyY) localValleyY = currentY;
              if (currentY < localValleyY - threshold && timeSinceState > cooldownSec) {
                localState = 'UP';
                localPeakY = currentY;
                localLastStateTime = currentSeek;
              }
            } else if (localState === 'UP') {
              if (currentY < localPeakY) localPeakY = currentY;
              if (currentY > localPeakY + threshold && timeSinceState > cooldownSec) {
                localState = 'DOWN';
                localValleyY = currentY;
                localLastStateTime = currentSeek;
                localCount++;

                if (localLastTurnTime > 0) {
                  turnTime = currentSeek - localLastTurnTime;
                  if (turnTime >= 0.12 && turnTime <= 4.0) {
                    // 【変更】 Speedの計算結果を2で割る
                    currentS = (60.0 / turnTime) / 2.0;
                    localSpeedHist.push(currentS);
                    if (localSpeedHist.length > 3) localSpeedHist.shift();
                    smoothedS = localSpeedHist.reduce((a, b) => a + b, 0) / localSpeedHist.length;
                  }
                }
                localLastTurnTime = currentSeek;

                const relTime = currentSeek - startTime;
                analysisTimestamps.push({
                  count: localCount,
                  videoTime: currentSeek,
                  elapsedSec: relTime,
                  speed: smoothedS,
                  turnTime: turnTime
                });

                analysisRecData.push({
                  unixMs: relTime * 1000,
                  id: localCount,
                  calculatedValue: smoothedS > 0 ? smoothedS : null
                });
              }
            }
          }
        }

        stepCount++;
        currentSeek += step;

        const progressRatio = Math.min(stepCount / totalSteps, 1.0);
        progressBarFill.style.width = `${Math.round(progressRatio * 100)}%`;
        progressPercent.innerText = `${Math.round(progressRatio * 100)}%`;

        const elapsedProc = (performance.now() - processStartTime) / 1000;
        if (progressRatio > 0) {
          const estimatedTotal = elapsedProc / progressRatio;
          const eta = Math.max(0, Math.ceil(estimatedTotal - elapsedProc));
          progressEta.innerText = `ETA: ${eta}s`;
        }
      }

      fileAnalysisResult = {
        startTime: startTime,
        endTime: endTime,
        duration: duration,
        totalCount: localCount,
        timestamps: analysisTimestamps,
        recordedData: analysisRecData
      };

      // 履歴に自動登録
      const now = new Date();
      const timestampStr = `[File] ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
      measurementHistory.unshift({
        timestampStr: timestampStr,
        count: localCount,
        duration: selectedDur === 0 ? 0 : duration,
        recordedData: [...analysisRecData],
        countTimestamps: [...analysisTimestamps]
      });
      currentActiveRecordData = analysisRecData;

      processingOverlay.classList.remove('open');
      videoElement.currentTime = startTime;
      renderVideoFileFrame();
    }

    // 動画ファイルの同期描画ループ（再生中にタイムスタンプからオーバーレイを描画）
    function renderVideoFileFrame() {
      if (sourceMode !== 'file') return;

      const vWidth = videoElement.videoWidth || 640;
      const vHeight = videoElement.videoHeight || 480;

      let nativeW = (rotationAngle === 90 || rotationAngle === 270) ? vHeight : vWidth;
      let nativeH = (rotationAngle === 90 || rotationAngle === 270) ? vWidth : vHeight;

      mediaContainer.classList.toggle('portrait', nativeH > nativeW);
      mediaContainer.classList.toggle('landscape', nativeH <= nativeW);

      canvasElement.width = nativeW;
      canvasElement.height = nativeH;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, nativeW, nativeH);

      canvasCtx.translate(nativeW / 2, nativeH / 2);
      if (flipH || flipV) canvasCtx.scale(flipH ? -1 : 1, flipV ? -1 : 1);
      canvasCtx.rotate((rotationAngle * Math.PI) / 180);
      canvasCtx.scale(zoomFactor, zoomFactor);

      canvasCtx.drawImage(videoElement, -vWidth / 2, -vHeight / 2, vWidth, vHeight);
      canvasCtx.restore();

      // 動画解析結果に基づくオーバーレイ情報の検索
      let curCount = 0;
      let curSpeed = 0.0;
      let curTurnTime = 0.0;
      let curElapsed = 0.0;

      if (fileAnalysisResult) {
        const vTime = videoElement.currentTime;
        const startT = fileAnalysisResult.startTime;

        if (vTime >= startT) {
          curElapsed = Math.min(vTime - startT, fileAnalysisResult.duration);
          const pastItems = fileAnalysisResult.timestamps.filter(t => t.videoTime <= vTime);

          if (pastItems.length > 0) {
            const lastItem = pastItems[pastItems.length - 1];
            curCount = lastItem.count;
            curSpeed = lastItem.speed || 0;
            curTurnTime = lastItem.turnTime || 0;
          }
        }
      }

      document.getElementById('count-val').innerText = curCount;
      document.getElementById('speed-val').innerText = curSpeed > 0 ? curSpeed.toFixed(1) : '0.0';
      document.getElementById('time-val').innerText = curTurnTime > 0 ? curTurnTime.toFixed(2) + 's' : '0.00s';

      // グラフ更新（動画解析時）
      if (currentGraph === 'speed' && fileAnalysisResult) {
        const pastItems = fileAnalysisResult.timestamps.filter(t => t.videoTime <= videoElement.currentTime);
        chart.data.datasets[0].data = pastItems.map((item, idx) => ({ x: idx, y: item.speed }));
        chart.data.datasets[1].data = pastItems.map((item, idx) => ({ x: idx, y: item.speed }));
        chart.update();
      }

      const showText = overlayShowTextCheck.checked;
      const scale = parseFloat(overlayScaleSlider.value);
      const textColor = overlayTextColorInput.value || '#ffffff';

      canvasCtx.save();
      if (showText) {
        canvasCtx.fillStyle = textColor;
        canvasCtx.font = `700 ${Math.round(16 * scale)}px "Roboto Mono", monospace`;
        canvasCtx.fillText(`C: ${curCount} | T: ${curElapsed.toFixed(1)}s`, 12, 24 * scale);
      }
      canvasCtx.restore();

      animFrameId = requestAnimationFrame(renderVideoFileFrame);
    }

    function toTimeSeriesData(arr) {
      return arr.map((val, index) => ({ x: index, y: val }));
    }

    function updateChart() {
      if (currentGraph === 'none') return;
      if (sourceMode === 'file') return; // 動画モード時はrenderVideoFileFrameで処理

      if (currentGraph === 'orbit' && currentRole === 'turner') {
        chart.options.aspectRatio = 1;
        chart.data.datasets[0].data = buffer.lw_x.map((x, i) => ({ x: x, y: 1.0 - buffer.lw_y[i] }));
        chart.data.datasets[1].data = buffer.rw_x.map((x, i) => ({ x: x, y: 1.0 - buffer.rw_y[i] }));
      } else {
        chart.options.aspectRatio = 2.2;
        chart.data.datasets[1].data = [];
        if (currentGraph === 'speed') {
          chart.data.datasets[0].data = toTimeSeriesData(buffer.raw_speed);
          chart.data.datasets[1].data = toTimeSeriesData(buffer.smoothed_speed);
        } else if (currentGraph === 'axis') {
          chart.data.datasets[0].data = toTimeSeriesData(buffer.target_val);
        }
      }
      chart.update();
    }

    async function processVideoFrame() {
      if (sourceMode === 'camera') {
        if (videoElement.readyState >= 2 && !isProcessing && !videoElement.paused && !videoElement.ended) {
          isProcessing = true;
          await pose.send({ image: videoElement });
          isProcessing = false;
        }
        animFrameId = requestAnimationFrame(processVideoFrame);
      }
    }

    function switchSourceMode(mode) {
      sourceMode = mode;
      resetCounter();

      document.getElementById('tab-camera').classList.toggle('active', mode === 'camera');
      document.getElementById('tab-file').classList.toggle('active', mode === 'file');

      document.getElementById('camera-settings').style.display = mode === 'camera' ? 'flex' : 'none';
      document.getElementById('file-settings').style.display = mode === 'file' ? 'flex' : 'none';
      fileControlsBar.style.display = mode === 'file' ? 'block' : 'none';

      cameraSwitchBtn.style.display = mode === 'camera' ? 'flex' : 'none';
      timerToggleBtn.style.display = mode === 'camera' ? 'flex' : 'none';
      shutterAnalyticsBtn.style.display = mode === 'camera' ? 'flex' : 'none';

      // 動画解析モード制限コントロール
      const roleTurnerBtn = document.getElementById('role-turner-btn');
      const roleJumperBtn = document.getElementById('role-jumper-btn');
      const graphAxisBtn = document.getElementById('graph-axis-btn');
      const graphOrbitBtn = document.getElementById('graph-orbit-btn');
      const labelOverlayShowSkel = document.getElementById('label-overlay-show-skel');

      if (mode === 'file') {
        roleTurnerBtn.disabled = true;
        roleJumperBtn.disabled = true;
        graphAxisBtn.disabled = true;
        graphOrbitBtn.disabled = true;

        overlayShowSkelCheck.disabled = true;
        labelOverlayShowSkel.classList.add('disabled');

        setGraphMode('speed');
      } else {
        roleTurnerBtn.disabled = false;
        roleJumperBtn.disabled = false;
        graphAxisBtn.disabled = false;
        graphOrbitBtn.disabled = false;

        overlayShowSkelCheck.disabled = false;
        labelOverlayShowSkel.classList.remove('disabled');
      }

      if (animFrameId) cancelAnimationFrame(animFrameId);
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
        currentStream = null;
      }

      videoElement.pause();
      videoElement.src = "";
      videoElement.srcObject = null;

      if (mode === 'camera') setupCameraList();
      else {
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      }
    }

    async function updateSupportedFpsOptions(deviceId) {
      fpsSelect.innerHTML = '<option value="30">30 FPS</option>';
    }

    async function startCamera(deviceId, targetFps = 30) {
      if (animFrameId) cancelAnimationFrame(animFrameId);
      if (currentStream) currentStream.getTracks().forEach(track => track.stop());

      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { ...(deviceId ? { deviceId: { exact: deviceId } } : {}), width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        videoElement.srcObject = currentStream;
        await videoElement.play();
        processVideoFrame();
      } catch (err) {}
    }

    async function setupCameraList() {
      try {
        const tempStream = await navigator.mediaDevices.getUserMedia({ video: true });
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(d => d.kind === 'videoinput');

        cameraSelect.innerHTML = '';
        cameraSwitchBtn.style.display = videoDevices.length > 1 ? 'flex' : 'none';

        videoDevices.forEach((device, index) => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          option.text = device.label || `Cam ${index + 1}`;
          cameraSelect.appendChild(option);
        });

        tempStream.getTracks().forEach(track => track.stop());
        if (videoDevices.length > 0) startCamera(videoDevices[0].deviceId);
      } catch (err) {}
    }

    videoFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      fileNameDisplay.innerText = file.name;
      videoElement.srcObject = null;
      videoElement.src = URL.createObjectURL(file);
      videoElement.load();

      videoElement.onloadedmetadata = () => {
        seekSlider.max = videoElement.duration;
        resetCounter();
        videoElement.play();
        if (playIcon) playIcon.innerText = 'pause';
        renderVideoFileFrame();
      };
    });

    function toggleVideoPlay() {
      if (videoElement.paused) {
        videoElement.play();
        if (playIcon) playIcon.innerText = 'pause';
      } else {
        videoElement.pause();
        if (playIcon) playIcon.innerText = 'play_arrow';
      }
    }

    videoElement.addEventListener('timeupdate', () => {
      if (sourceMode === 'file') {
        seekSlider.value = videoElement.currentTime;
        const curM = Math.floor(videoElement.currentTime / 60).toString().padStart(2, '0');
        const curS = Math.floor(videoElement.currentTime % 60).toString().padStart(2, '0');
        const durM = Math.floor((videoElement.duration || 0) / 60).toString().padStart(2, '0');
        const durS = Math.floor((videoElement.duration || 0) % 60).toString().padStart(2, '0');
        videoTimeDisplay.innerText = `${curM}:${curS} / ${durM}:${durS}`;
      }
    });

    seekSlider.addEventListener('input', (e) => {
      videoElement.currentTime = parseFloat(e.target.value);
    });

    playbackRateSelect.addEventListener('change', (e) => {
      videoElement.playbackRate = parseFloat(e.target.value);
    });

    cameraSelect.addEventListener('change', (e) => {
      if (e.target.value && sourceMode === 'camera') startCamera(e.target.value);
    });

    updateTimerLabel();
    setupCameraList();
  </script>
</body>
</html>
